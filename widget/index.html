<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>在办案件</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- 透明窗上一张自绘的圆角卡片（ADR-0004）：柔投影画在卡片外那圈透明边距里。 -->
  <div class="card">
    <div class="win-controls" aria-label="窗口">
      <button id="minimize" type="button" aria-label="最小化" title="最小化" disabled><span aria-hidden="true">−</span></button>
      <button id="close" type="button" aria-label="关闭" title="关闭" disabled><span aria-hidden="true">×</span></button>
    </div>
    <div class="top" id="top"><span id="heading">在办案件 <span id="count">—</span></span></div>
    <p class="banner" id="window-error" role="alert" hidden></p>
    <p class="banner" id="scan-error" role="alert" hidden></p>
    <section class="page" aria-label="清单页">
      <div id="rows"></div>
      <div id="unreadable"></div>
      <p class="guide" id="settings-error" role="alert" hidden></p>
    </section>
  </div>
  <label id="development" hidden>开发预览：载入扫描结果 <input id="preview" type="file" accept="application/json,.json"></label>
  <script type="module" src="./app.js"></script>
</body>
</html>

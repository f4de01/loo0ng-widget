<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>在办案件</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- 透明窗上一张自绘的圆角卡片（ADR-0004）：柔投影画在卡片外那圈透明边距里。 -->
  <div class="card">
    <div class="win-controls" aria-label="窗口">
      <button id="minimize" type="button" aria-label="最小化" title="最小化" disabled><span aria-hidden="true">−</span></button>
      <button id="close" type="button" aria-label="关闭" title="关闭" disabled><span aria-hidden="true">×</span></button>
    </div>
    <!-- 两页一窗（#18）：顶行与正文各一条横滑轨道，同一个类一起推；横幅夹在两条轨道之间，两页共用。 -->
    <div class="track" id="tops">
      <div class="top" id="list-top"><span id="heading">在办案件 <span id="count">—</span></span></div>
      <div class="top case-head" id="case-top">
        <button id="back" type="button" aria-label="返回清单页" title="返回"><span aria-hidden="true">‹</span></button>
        <div class="barline" id="case-bar"></div>
        <!-- 两种形式（#19）：当前那个填色，选择记进呈现偏好。 -->
        <div class="forms" role="group" aria-label="形式">
          <button type="button" data-form="module">模块</button>
          <button type="button" data-form="matrix">矩阵</button>
        </div>
      </div>
    </div>
    <p class="banner" id="window-error" role="alert" hidden></p>
    <p class="banner" id="scan-error" role="alert" hidden></p>
    <div class="track bodies" id="bodies">
      <section class="page" id="list-page" aria-label="清单页">
        <div id="rows"></div>
        <div id="root-errors"></div>
        <!-- 已归档 N（#27）：清单页末尾一行，默认折叠，N 为 0 不出现；展开后每案一行，只有目录名与「恢复」。 -->
        <div id="archived" hidden>
          <button id="archived-toggle" type="button" aria-expanded="false"><span class="chevron"></span>已归档 <span id="archived-count"></span></button>
          <div id="archived-rows"></div>
        </div>
        <p class="guide" id="settings-error" role="alert" hidden></p>
      </section>
      <section class="page" id="case-page" aria-label="案件页"></section>
    </div>
    <!-- 悬浮概览：自绘，不用原生 title。矩阵格上四行；模块视里只补时限全文。 -->
    <div class="pop" id="pop" role="tooltip" hidden></div>
  </div>
  <!-- 案件归档（#29）：清单页每案右侧一枚盒子形图标，渲染时每行克隆一份；点了那案就地收起，不弹确认。 -->
  <template id="archive-template">
    <button class="archive" type="button" aria-label="归档"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2.5" width="12" height="11" rx="2.5"/><path d="M2 6.5h12M6.5 9.5h3"/></svg></button>
  </template>
  <label id="development" hidden>开发预览：载入扫描结果 <input id="preview" type="file" accept="application/json,.json"></label>
  <script type="module" src="./app.js"></script>
</body>
</html>

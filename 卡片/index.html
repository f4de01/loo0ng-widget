<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>案件卡片</title>
<style>
  :root {
    --底: rgba(22, 24, 28, 0.94);
    --字: #e9eaee;
    --淡: #9aa0aa;
    --线: rgba(255, 255, 255, 0.10);
    --重点: #f0b429;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 13px/1.5 "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
    color: var(--字);
    background: transparent;
    user-select: none;
  }
  .卡 {
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--底);
    border: 1px solid var(--线);
    border-radius: 10px;
    overflow: hidden;
  }

  /* 表头：按住它拖窗口。窗口控件按平台摆，样式也按平台走。 */
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 0 0 12px;
    height: 32px;
    border-bottom: 1px solid var(--线);
    cursor: default;
  }
  header b { font-weight: 600; }
  header .状态 { margin-left: auto; color: var(--淡); font-size: 11px; padding-right: 8px; }

  .控件 { display: flex; align-items: center; }

  /* Windows：右上角，一条杠与一个叉，关闭悬停变红。 */
  body.win header { padding-right: 0; }
  /* 控件在 DOM 里排在最前（mac 的红绿灯在左），Windows 要把它整组推到最右。 */
  body.win .控件 { order: 3; height: 100%; }
  body.win .控件 button {
    width: 46px; height: 100%;
    border: 0; background: transparent; color: var(--字);
    font: 15px/1 "Segoe Fluent Icons", "Segoe MDL2 Assets", system-ui, sans-serif;
    cursor: default;
  }
  body.win .控件 button:hover { background: rgba(255, 255, 255, 0.10); }
  body.win .控件 button.关:hover { background: #c42b1c; color: #fff; }

  /* macOS：左上角红绿灯，关闭在最左。 */
  body.mac header { padding-left: 10px; }
  body.mac .控件 { order: -1; gap: 8px; margin-right: 4px; }
  body.mac .控件 button {
    width: 12px; height: 12px; padding: 0;
    border: 0; border-radius: 50%; font-size: 0; cursor: default;
  }
  body.mac .控件 button.关 { background: #ff5f57; }
  body.mac .控件 button.最小 { background: #febc2e; }

  .身 { flex: 1; overflow: auto; padding: 4px 0; }
  .行 {
    padding: 8px 12px;
    border-bottom: 1px solid var(--线);
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 2px 10px;
  }
  .行:last-child { border-bottom: 0; }
  .名 { font-weight: 600; }
  .进度 { color: var(--淡); font-variant-numeric: tabular-nums; }
  .次 { grid-column: 1 / -1; color: var(--淡); font-size: 12px; }
  .待看 { color: var(--重点); }
  .坏 { padding: 8px 12px; color: #ff8f8f; font-size: 12px; }

  footer {
    border-top: 1px solid var(--线);
    padding: 6px 10px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--淡);
  }
  footer button {
    font: inherit;
    color: var(--字);
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--线);
    border-radius: 6px;
    padding: 3px 8px;
    cursor: default;
  }
  footer button:hover { background: rgba(255, 255, 255, 0.12); }
  footer .右 { margin-left: auto; font-variant-numeric: tabular-nums; }
  details { padding: 6px 12px; color: var(--淡); font-size: 11px; }
  pre { white-space: pre-wrap; word-break: break-all; max-height: 40vh; overflow: auto; }
</style>
</head>
<body>
<div class="卡">
  <header id="表头">
    <div class="控件">
      <button class="最小" id="最小化" title="最小化">&#xE921;</button>
      <button class="关" id="关闭" title="关闭">&#xE8BB;</button>
    </div>
    <b>在办案件</b>
    <span class="状态" id="来源"></span>
  </header>
  <div class="身" id="身">载入中</div>
  <details>
    <summary>完整状态</summary>
    <pre id="原始"></pre>
  </details>
  <footer>
    <button id="刷新">扫一次</button>
    <button id="轮询">开轮询</button>
    <span class="右" id="计时"></span>
  </footer>
</div>

<!-- 原型期的探针：把页面的处境报给 原型/探针.py。答完题整段删。 -->
<script>
  window.探报 = o => {
    try {
      fetch('http://127.0.0.1:8787/探针', {
        method: 'POST',
        body: JSON.stringify(o),
        headers: { 'Content-Type': 'text/plain' },
      }).catch(() => {});
    } catch (_) {}
  };
  window.addEventListener('error', e => window.探报({ 阶段: 'error', 话: String(e.message) }));
  window.addEventListener('unhandledrejection', e => window.探报({
    阶段: '没接住的 reject',
    话: String((e.reason && (e.reason.stack || e.reason.message)) || e.reason),
  }));
</script>

<script type="module">
import { 汇总 } from './aggregate.js';
import { 扫一次, 在宿主里, 报错 } from './read.js';

const ZEBAR = 'https://esm.sh/zebar@3.3.1';
const 身 = document.getElementById('身');
const 原始 = document.getElementById('原始');
const 来源栏 = document.getElementById('来源');
const 计时 = document.getElementById('计时');
const 表头 = document.getElementById('表头');

let 定时器 = null;
const 间隔毫秒 = 5000;
let 次数 = 0;
let 耗时累计 = 0;

function 转义(s) {
  return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}

/* ---------------------------------------------------------------- 窗口行为

宿主不放行两件事：给窗口装上系统装饰（`set_decorations`），以及 Tauri 自己的拖动
（`start_dragging`，也就是 `data-tauri-drag-region` 背后那一个）。放行的是读位置与
`setPosition`，所以拖动这里自己算：按住表头，鼠标挪多少，窗口挪多少。

最小化用系统的 `minimize`；还原不能由我们来做（`unminimize` 也不放行），所以窗口必须
出现在任务栏/程序坞里，还原交给系统，这就是「按各平台常规逻辑」的落法。
------------------------------------------------------------------------- */

const 是mac = /Mac|iPhone|iPad/.test(navigator.userAgent);
document.body.classList.add(是mac ? 'mac' : 'win');

if (在宿主里()) {
  // 按下表头那一刻不能再等 import：动态 import 回来之前鼠标早就松了。
  // 所以启动时先把宿主与 PhysicalPosition 取好，按下时只做同步的事。
  const [zebar, dpi] = await Promise.all([
    import(ZEBAR),
    import('https://esm.sh/@tauri-apps/api@2/dpi'),
  ]);
  const 卡 = zebar.currentWidget();
  const 窗 = 卡.tauriWindow;
  const PhysicalPosition = dpi.PhysicalPosition;
  window.探报 && window.探报({ 阶段: '窗口就位' });

  表头.addEventListener('mousedown', e => {
    if (e.button !== 0 || e.target.closest('.控件')) return;
    e.preventDefault();
    const 起鼠 = { x: e.screenX, y: e.screenY };
    const 比 = window.devicePixelRatio || 1;
    let 起窗 = null;
    let 待挪 = null;
    let 排队 = false;

    窗.outerPosition().then(p => { 起窗 = { x: p.x, y: p.y }; });

    const 挪 = () => {
      排队 = false;
      if (待挪) 窗.setPosition(new PhysicalPosition(待挪.x, 待挪.y)).catch(() => {});
    };
    const 动 = ev => {
      if (!起窗) return;
      待挪 = {
        x: Math.round(起窗.x + (ev.screenX - 起鼠.x) * 比),
        y: Math.round(起窗.y + (ev.screenY - 起鼠.y) * 比),
      };
      if (!排队) { 排队 = true; requestAnimationFrame(挪); }
    };
    const 松 = () => {
      window.removeEventListener('mousemove', 动);
      window.removeEventListener('mouseup', 松);
      window.探报 && window.探报({ 阶段: '拖完了', 挪到: 待挪, 比 });
    };
    window.addEventListener('mousemove', 动);
    window.addEventListener('mouseup', 松);
    window.探报 && window.探报({ 阶段: '按住表头了', 起鼠, 比 });
  });

  document.getElementById('最小化').onclick = () => {
    window.探报 && window.探报({ 阶段: '点了最小化' });
    窗.minimize().catch(err => 报错('最小化失败：' + err));
  };
  document.getElementById('关闭').onclick = () => {
    window.探报 && window.探报({ 阶段: '点了关闭' });
    卡.close()
      .then(() => window.探报 && window.探报({ 阶段: '关闭调用返回了' }))
      .catch(err => { window.探报 && window.探报({ 阶段: '关闭报错', 话: String(err) }); 报错('关闭失败：' + err); });
  };
} else {
  document.querySelector('.控件').style.display = 'none';
}

/* ---------------------------------------------------------------- 画与扫 */

function 画(结果, 扫描) {
  const 块 = [];
  for (const r of 结果.行) {
    const 待 = r.待看.length
      ? `<span class="待看">${r.待看.length} 处等你看</span>`
      : '没有等你看的';
    块.push(`
      <div class="行">
        <div class="名">${转义(r.目录名)}</div>
        <div class="进度">${r.进度.已确认} / ${r.进度.总数}</div>
        <div class="次">当前：${转义(r.当前模块 ?? '无')}　下一个：${转义(r.下一个 ?? '无')}</div>
        <div class="次">${待}</div>
      </div>`);
  }
  for (const 坏 of 结果.读不出) {
    块.push(`<div class="坏">${转义(坏.目录名)}：${转义(坏.原因)}</div>`);
  }
  if (!块.length) 块.push('<div class="坏">这些根目录下没有找到案件</div>');
  身.innerHTML = 块.join('');

  来源栏.textContent = `${扫描.来源}　${结果.行.length} 案`;
  原始.textContent = JSON.stringify({ 结果, 扫描: { ...扫描, 案件: undefined } }, null, 2);
}

async function 跑一次() {
  try {
    const 扫描 = await 扫一次();
    次数 += 1;
    耗时累计 += 扫描.耗时 ?? 0;
    画(汇总(扫描), 扫描);
    计时.textContent = `第 ${次数} 次　本次 ${扫描.耗时}ms　平均 ${Math.round(耗时累计 / 次数)}ms`;
  } catch (e) {
    身.innerHTML = `<div class="坏">${转义(e.message)}</div>`;
    原始.textContent = String(e.stack || e);
    报错(e.message);
  }
}

document.getElementById('刷新').onclick = 跑一次;

document.getElementById('轮询').onclick = e => {
  if (定时器) {
    clearInterval(定时器);
    定时器 = null;
    e.target.textContent = '开轮询';
  } else {
    定时器 = setInterval(跑一次, 间隔毫秒);
    e.target.textContent = `关轮询（${间隔毫秒 / 1000}s）`;
  }
};

跑一次();
// 原型期默认就开着轮询，这样「图变了卡片跟不跟」不必靠人去点。
document.getElementById('轮询').click();
</script>
</body>
</html>
